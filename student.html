<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Étudiants - ENAA</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #f8f9fa;
    }

   
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
    background-color: rgb(23, 55, 97);
      z-index: 1000;
    }

    
    .sidebar {
      position: fixed;
      top: 60px;
      left: 0;
      width: 230px;
      height: calc(100vh - 60px);
     background-color: rgb(23, 55, 97);
      padding: 1rem;
      transition: transform 0.3s ease;
      z-index: 999;
    }

    .sidebar .nav-link {
      color: white;
      border-radius: 8px;
      padding: 10px 15px;
    }

     .sidebar .nav-link.active {
      background-color: #0d2340;
    }

    
    .main-content {
      margin-left: 230px;
      margin-top: 60px;
      padding: 1.5rem;
      transition: margin-left 0.3s ease;
    }

  
    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

     
    @media (max-width: 991px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.show {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
      }

      .menu-toggle {
        display: block;
      }

     
      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 60px;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 998;
      }

      .sidebar-overlay.show {
        display: block;
      }
    }

    @media (max-width: 768px) {
      .header {
        height: 56px;
      }

      .sidebar {
        top: 56px;
        height: calc(100vh - 56px);
        width: 260px;
      }

      .main-content {
        margin-top: 56px;
        padding: 1rem;
      }

      
      .stats-card {
        margin-bottom: 1rem;
      }

   
      .table-responsive {
        font-size: 0.875rem;
      }

    
      .search-section .col-md-6 {
        margin-bottom: 0.75rem;
      }
    }

    @media (max-width: 576px) {
      .main-content {
        padding: 0.75rem;
      }

      .main-content h1 {
        font-size: 1.5rem;
      }

    
      .card-body {
        padding: 1rem !important;
      }

      
      .modal-dialog {
        margin: 0.5rem;
      }

 
      .hide-mobile {
        display: none;
      }
    }
  </style>
</head>

<body>

<!-- Sidebar Overlay for Mobile -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ================= HEADER ================= -->
<nav class="header navbar navbar-dark px-3 px-md-4 d-flex justify-content-between">
  <div class="d-flex align-items-center gap-2">
    <button class="menu-toggle" id="menuToggle">
      <i class="fas fa-bars"></i>
    </button>
    <span class="navbar-brand fw-bold mb-0">Enaa</span>
  </div>

  <div class="d-flex align-items-center gap-2 text-white">
    <i class="fas fa-user-circle"></i>
    <span class="d-none d-sm-inline">Zakaria</span>
  </div>
</nav>

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar" id="sidebar">
  <div class="d-flex flex-column justify-content-between h-100">
    <!-- Navigation items -->
    <ul class="nav flex-column gap-2">
      <li class="nav-item">
        <a class="nav-link text-white " href="/index.html">
          <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white active" href="/student.html">
          <i class="bi bi-mortarboard me-2"></i> Students
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="/presence.html">
          <i class="bi bi-person-workspace me-2"></i> Presence
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="/history.html">
          <i class="bi bi-journal-text me-2"></i> History
        </a>
      </li>
    </ul>
    <!-- Logout button at bottom -->
    <div>
      <a class="nav-link text-danger" href="#">
        <i class="bi bi-box-arrow-right me-2"></i> Déconnexion
      </a>
    </div>
  </div>
</aside>

<!-- ================= MAIN CONTENT ================= -->
<div class="main-content">

  <h1 class="mb-3 mb-md-4 fw-bold">Gestion des Étudiants</h1>

  <!-- Stats -->
  <div class="row g-2 g-md-3 mb-3 mb-md-4">
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card border-0 stats-card" style="background:#1e3a5f;">
        <div class="card-body text-white d-flex justify-content-between align-items-center">
          <div>
            <p class="mb-1 small">Total Étudiants</p>
            <h2 class="fw-bold mb-0">25</h2>
          </div>
          <div class="bg-success rounded-circle p-2 p-md-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
            <i class="fas fa-users"></i>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card border-0 stats-card" style="background:#1e3a5f;">
        <div class="card-body text-white d-flex justify-content-between align-items-center">
          <div>
            <p class="mb-1 small">Étudiants Actifs</p>
            <h2 class="fw-bold mb-0">21</h2>
          </div>
          <div class="bg-success rounded-circle p-2 p-md-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
            <i class="fas fa-user-check"></i>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card border-0 stats-card" style="background:#1e3a5f;">
        <div class="card-body text-white d-flex justify-content-between align-items-center">
          <div>
            <p class="mb-1 small">Étudiants Inactifs</p>
            <h2 class="fw-bold mb-0">4</h2>
          </div>
          <div class="bg-danger rounded-circle p-2 p-md-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
            <i class="fas fa-user-times"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Search + Button -->
  <div class="row mb-3 search-section">
    <div class="col-12 col-md-6 mb-2 mb-md-0">
      <div class="input-group">
        <span class="input-group-text bg-dark border-dark">
          <i class="fas fa-search text-white"></i>
        </span>
        <input type="text" class="form-control border-dark" placeholder="Rechercher...">
      </div>
    </div>
    <div class="col-12 col-md-6 text-md-end">
      <button class="btn btn-primary w-100 w-md-auto"
              data-bs-toggle="modal"
              data-bs-target="#addStudentModal">
        <i class="fas fa-plus me-2"></i> Ajouter un étudiant
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="card border-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead style="background:#0a1929;color:white">
          <tr>
            <th>Étudiant</th>
            <th class="hide-mobile">Email</th>
            <th>Groupe</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody style="background:#1e3a5f;color:white">
 
  
          <tr>
            <td>
              <div class="d-flex align-items-center gap-2">
                <div class="bg-warning rounded-circle d-flex justify-content-center align-items-center flex-shrink-0"
                     style="width:35px;height:35px; font-size: 0.875rem; color: #000;">MC</div>
                <div>
                  <div class="fw-bold" style="font-size: 0.9rem;">Achraf out</div>
                  <small class="d-md-none text-white-50">achraf@gmail.com</small>
                </div>
              </div>
            </td>
            <td class="align-middle hide-mobile">mouadcharadi@gmail.com</td>
            <td class="align-middle">Groupe 4</td>
            <td class="align-middle"><span class="badge bg-danger">Inactive</span></td>
            <td class="align-middle">
              <i class="fas fa-eye me-2" style="cursor: pointer;"></i>
              <i class="fas fa-edit me-2" style="cursor: pointer;"></i>
              <i class="fas fa-trash" style="cursor: pointer;"></i>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- ================= MODAL ADD STUDENT ================= -->
<div class="modal fade" id="addStudentModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0" style="background:#163a63;color:white">

      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">
          <i class="fas fa-user-plus me-2"></i> Ajouter un étudiant
        </h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Nom</label>
            <input class="form-control" style="background:#0e2344;color:white;border:none">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Prénom</label>
            <input class="form-control" style="background:#0e2344;color:white;border:none">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" style="background:#0e2344;color:white;border:none">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Groupe</label>
            <select class="form-select" style="background:#0e2344;color:white;border:none">
              <option>Groupe 1</option>
              <option>Groupe 2</option>
              <option>Groupe 3</option>
              <option>Groupe 4</option>
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Statut</label>
            <select class="form-select" style="background:#0e2344;color:white;border:none">
              <option>Actif</option>
              <option>Inactif</option>
            </select>
          </div>
        </form>
      </div>

      <div class="modal-footer border-0 flex-column flex-sm-row gap-2">
        <button class="btn btn-outline-light w-100 w-sm-auto" data-bs-dismiss="modal">Annuler</button>
        <button class="btn btn-success w-100 w-sm-auto">
          <i class="fas fa-save me-1"></i> Enregistrer
        </button>
      </div>

    </div>
  </div>
</div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
 <script src="js/student.js"></script>
<script>
  // Mobile menu toggle
  const menuToggle = document.getElementById('menuToggle');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  menuToggle.addEventListener('click', function() {
    sidebar.classList.toggle('show');
    sidebarOverlay.classList.toggle('show');
  });

  sidebarOverlay.addEventListener('click', function() {
    sidebar.classList.remove('show');
    sidebarOverlay.classList.remove('show');
  });

 
  document.querySelectorAll('.sidebar .nav-link').forEach(link => {
    link.addEventListener('click', function() {
      if (window.innerWidth < 992) {
        sidebar.classList.remove('show');
        sidebarOverlay.classList.remove('show');
      }
    });
  });
</script>
</body>
</html>
